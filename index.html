<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ATP & WTA Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans+Extra+Condensed:wght@500;600;700&family=Golos+Text:wght@400;500;600&display=swap">
<meta name="description" content="ATP and WTA calendar, tournament draws, order of play in your time zone and live rankings">
<meta name="theme-color" content="#1f3fd0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tennis Board">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{color-scheme:light}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
.install{background:none;border:1px solid color-mix(in srgb,var(--board-muted) 55%,transparent);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--board-ink)}
.ios-tip{background:var(--board-ink);color:var(--board);border-radius:var(--r);padding:10px 14px;font-size:14px;width:100%}
/* Layout: scoreboard header, then one working column (max 1100px); brackets scroll sideways inside their own frame */
/* Light design (variant E): white surfaces, dark ink, deep non-neon colour. All = ATP blue + WTA violet mix; ATP = royal blue + ochre; WTA = deep violet + emerald. */
:root{
  --bg:#f7f7fb; --surface:#ffffff; --sunk:#f1f2f8; --ink:#1a1a40; --muted:#5a5c80; --line:#e0e0ee;
  --accent:#3b2db0; --accent-ink:#ffffff; --accent-soft:#e6e4f8; --accent-deep:#2c2186;
  --live:#9c2a1c; --live-soft:#f8e1dd; --done:#0f7a5e; --done-soft:#dcefe8;
  --hi:#f6ebd2; --hi-ink:#6b4a07;
  --hard:#2a5bb0; --hard-i:#5146a8; --clay:#b4552c; --grass:#2f7a3c; --mixed:#6a7086;
  --board:#ffffff; --board-ink:#1a1a40; --board-muted:#5a5c80;
  --board-line:linear-gradient(90deg,#2433a6 0 50%,#5426b0 50% 100%);
  --atp:#2433a6; --wta:#5426b0;
  --c-gs:#9a6400; --c-1000:#1f4fb0; --c-500:#6a35c8; --c-250:#0d7672; --c-fin:#b8336a;
  --f-display:"Fira Sans Extra Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px; color-scheme:light;
}
:root[data-tt="atp"]{
  --bg:#f6f7fb; --sunk:#eff1f8; --ink:#151b45; --muted:#545b80; --line:#dadeee;
  --accent:#2433a6; --accent-soft:#e3e7f7; --accent-deep:#1b2680;
  --done:#c8921e; --done-ink:#8a5f0d; --done-soft:#f6ebd2; --hi:#f6ebd2; --hi-ink:#6b4a07;
  --board-ink:#151b45; --board-muted:#545b80; --board-line:#2433a6}
:root[data-tt="wta"]{
  --bg:#f8f6fc; --sunk:#f2eef9; --ink:#221545; --muted:#62577f; --line:#e3dcf1;
  --accent:#5426b0; --accent-soft:#ece5f8; --accent-deep:#43208c;
  --done:#0f7a5e; --done-soft:#dcefe8; --hi:#dcefe8; --hi-ink:#0a5440;
  --board-ink:#221545; --board-muted:#62577f; --board-line:#5426b0}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--board)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

.board{background:var(--board);color:var(--board-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;box-shadow:0 1px 0 var(--line)}
.board::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:3px;background:var(--board-line)}
.brand .t-atp{color:var(--atp)} .brand .t-wta{color:var(--wta)}
:root[data-tt] .brand{color:var(--accent-deep)} :root[data-tt] .brand .t-atp,:root[data-tt] .brand .t-wta{color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.board .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding-block:12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.02em;text-transform:uppercase;line-height:1;display:flex;align-items:baseline;gap:10px}
.brand small{font-family:var(--f-body);font-weight:500;font-size:12px;letter-spacing:.06em;color:var(--board-muted);text-transform:uppercase}
.nav{display:flex;gap:4px;margin-left:auto}
.nav a{text-decoration:none;padding:7px 12px;border-radius:999px;font-size:14px;font-weight:500;color:var(--board-muted)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent-deep);font-weight:600}
@media (hover:hover){.nav a:not([aria-current="page"]):hover{color:var(--board-ink)}}
.stamp{font-size:12px;color:var(--board-muted);width:100%;display:flex;flex-wrap:wrap;gap:2px 16px}
.chip-sub{margin-left:8px;font-weight:600}
.rk{font-size:11px;color:var(--muted);margin-left:6px;font-weight:500;white-space:nowrap}
.mt .p .rk{margin-left:auto;flex:none}
.rank-grid{display:grid;gap:28px;grid-template-columns:minmax(0,1fr)}
@media (min-width:860px){.rank-grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rank-col{display:flex;flex-direction:column;gap:10px;min-width:0}
.rank-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px}
.rank-head h2{display:flex;gap:10px;align-items:baseline}
.rank-head h2 .tour{font-size:22px}
table.rank{width:100%;border-collapse:collapse;font-size:14px}
table.rank th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:0 6px 6px;border-bottom:2px solid var(--ink)}
table.rank th:last-child,table.rank td.pt{text-align:right}
table.rank td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:baseline}
table.rank td.pos{font-family:var(--f-display);font-weight:600;font-size:17px;width:3.2em}
table.rank td.pt{color:var(--muted);white-space:nowrap}
table.rank tr.prow:nth-child(-n+20) .pname{font-weight:600}
.pname{background:none;border:0;padding:0;font:inherit;color:var(--ink);cursor:pointer;text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.pname[aria-expanded="true"]{color:var(--accent);text-decoration-color:currentColor}
@media (hover:hover){.pname:hover{color:var(--accent);text-decoration-color:currentColor}}
td.mvc{width:3.2em;padding-left:0}
.mv{font-size:11px;font-weight:600;white-space:nowrap}
.mv.up,.dp.up{color:var(--done-ink,var(--done))}
.mv.down,.dp.down{color:var(--live)}
.mv.new{color:var(--accent);text-transform:uppercase;letter-spacing:.04em}
.dp{display:block;font-size:11px;font-weight:500}
tr.pdetail td{background:var(--surface);padding:12px 14px 14px;border-bottom:1px solid var(--line)}
.pd{display:flex;flex-direction:column;gap:8px}
.pd h4{margin:0;font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:baseline}
.pd h4 b{font-size:20px;color:var(--ink)}
.pd-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.pd-list li{display:grid;grid-template-columns:6.6em minmax(0,1fr) auto;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);white-space:nowrap}
.pd-list li:last-child{border-bottom:0}
.pd-name{font-weight:600;text-decoration:none;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
@media (hover:hover){.pd-name:hover{text-decoration:underline;text-underline-offset:3px}}
[data-g="gs"]{color:var(--c-gs)!important}
[data-g="1000"]{color:var(--c-1000)!important}
[data-g="500"]{color:var(--c-500)!important}
[data-g="250"]{color:var(--c-250)!important}
[data-g="finals"]{color:var(--c-fin)!important}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.pick{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;cursor:pointer;color:var(--ink)}
.pick .tour{font-size:28px}
.pick-sub{font-size:13px;color:var(--muted)}
.pick ol{margin:6px 0 2px;padding-left:1.4em;display:flex;flex-direction:column;gap:2px;font-weight:500}
.pick-go{font-size:14px;color:var(--accent);font-weight:600}
@media (hover:hover){.pick:hover{border-color:var(--accent)}}
.star{background:none;border:0;padding:0 2px;margin-left:4px;font-size:15px;line-height:1;color:var(--muted);cursor:pointer;flex:none}
.star[aria-pressed="true"]{color:var(--c-gs)}
@media (hover:hover){.star:hover{color:var(--c-gs)}}
table.rank .star{margin:0 6px 0 0}
.mt .p.fav{background:color-mix(in srgb,var(--c-gs) 12%,transparent)}
tr.prow.fav td{background:color-mix(in srgb,var(--c-gs) 9%,transparent)}
.players .fav{font-weight:600}
.mine-sec{gap:8px}
.mine-toggle{display:flex;align-items:baseline;justify-content:space-between;gap:12px;width:100%;background:none;border:0;padding:0;cursor:pointer;text-align:left;color:var(--ink)}
.mine-count{font-family:var(--f-body);font-size:13px;font-weight:600;letter-spacing:0;color:var(--muted);margin-left:6px;vertical-align:3px}
.mine-act{font-size:14px;color:var(--accent);font-weight:600;white-space:nowrap}
.mine-sum{margin:0;font-size:14px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.mine-sum b{color:var(--ink)}
.mine-sum span{font-weight:600}
.mine{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.mine-row{display:grid;grid-template-columns:auto auto auto minmax(0,1fr);align-items:baseline;gap:4px 10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.mine-row:last-child{border-bottom:0}
.star-static{color:var(--c-gs);font-size:15px;line-height:1}
.mine-name{white-space:nowrap}
.mine-info{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;justify-content:flex-end;min-width:0}
.mine-info a{font-weight:600;text-decoration:none}
@media (max-width:560px){.mine-row{grid-template-columns:auto auto minmax(0,1fr)}.mine-info{grid-column:1/-1;justify-content:flex-start;padding-left:24px}}
.legend{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;font-size:14px}
.legend span{font-weight:600}
.legend .hint{font-weight:400}
.pd-date{font-family:var(--f-display);font-weight:600;color:var(--muted)}
.pd-res{font-size:12px;font-weight:600;color:var(--muted)}
.pd-list li.r-W .pd-res{color:var(--done-ink,var(--done))}
.pd-list li.r-P .pd-res{color:var(--live)}
.pd-list .cat{font-size:11px;padding:1px 6px}
.pd-sum{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:13px;color:var(--muted)}
.pd-sum b{font-family:var(--f-display);font-size:20px;color:var(--ink);margin-right:2px}
@media (max-width:520px){.pd-list li{grid-template-columns:6.2em minmax(0,1fr) auto;gap:8px}.pd-date{font-size:13px}}
.playing{display:inline-block;margin-left:8px;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--live-soft);color:var(--live);text-decoration:none;white-space:nowrap}
.rank-search{display:flex;flex-direction:column;gap:4px}
.rank-search input{font:inherit;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);min-width:0;width:240px;max-width:100%}
.nowtag{font-style:normal;font-family:var(--f-body);font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:none;margin-left:8px;padding:1px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent-deep);vertical-align:2px}
.row.hint{gap:4px 14px}
.tours{display:flex;border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:2px}
.tours button{background:none;border:0;padding:5px 12px;border-radius:999px;font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.06em;color:var(--board-muted);cursor:pointer}
.tours button[aria-pressed="true"]{background:var(--accent);color:#fff}
.tours button[data-tour="all"][aria-pressed="true"]{background:linear-gradient(90deg,var(--atp),var(--wta))}
.tours button[data-tour="wta"][aria-pressed="true"]{background:var(--wta)}
.tours button[data-tour="atp"][aria-pressed="true"]{background:var(--atp)}
.tour{font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.08em;color:var(--atp)}
.tour[data-t="wta"]{color:var(--wta)}

main.wrap{padding-block:20px 48px;display:flex;flex-direction:column;gap:28px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:34px}
h2{font-size:22px;text-transform:uppercase;letter-spacing:.04em}
.sec{display:flex;flex-direction:column;gap:12px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:13px}

.state{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:20px;color:var(--muted)}

/* category + surface marks */
.cat{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:4px;border:1px solid var(--line);white-space:nowrap;color:var(--ink)}
.cat[data-c="gs"]{background:#f6ebd2;color:#6b4a07;border-color:#ead7ab}
.cat[data-c="m1000"],.cat[data-c="finals"]{background:#e3e7f7;color:#1b2680;border-color:#cfd6f0}
.cat[data-c="w1000"],.cat[data-c="wfinals"]{background:#ece5f8;color:#43208c;border-color:#dccff2}
.surf{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap}
.surf::before{content:"";width:10px;height:10px;border-radius:2px;background:var(--c,var(--mixed))}
.pts{font-size:12px;color:var(--muted);white-space:nowrap}

/* live tournament cards */
.live-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
@media (max-width:700px){
  .live-grid{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:max(16px, env(safe-area-inset-left, 0px));gap:10px;margin-inline:calc(-1 * max(16px, env(safe-area-inset-left, 0px)));padding:2px max(16px, env(safe-area-inset-left, 0px)) 6px}
  .live-grid .tcard{flex:0 0 230px;scroll-snap-align:start;padding:12px 14px;gap:6px}
  .live-grid .tcard h3{font-size:19px}
  .live-grid .state{flex:1 0 100%}
}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px;text-decoration:none;min-width:0}
@media (hover:hover){.tcard:hover{border-color:var(--accent)}}
.tcard h3{font-size:22px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.pill{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.live{background:var(--live-soft);color:var(--live)}
.pill.done{background:var(--done-soft);color:var(--done-ink,var(--done));border:0}

/* day schedule */
.days{display:flex;flex-direction:column;gap:18px}
.day h3{font-size:18px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding-bottom:6px;border-bottom:2px solid var(--ink);margin-bottom:4px}
.day h3 b{color:var(--ink);font-weight:600}
.mrow{display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:4px 14px;align-items:start;padding:10px 2px;border-bottom:1px solid var(--line)}
.mrow .time{font-family:var(--f-display);font-weight:600;font-size:20px;line-height:1.1}
.mrow .time small{display:block;font-family:var(--f-body);font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.02em}
.mrow .who{min-width:0}
.mrow .players{font-weight:500}
.mrow .players .w{font-weight:600}
.mrow .players .vs{color:var(--muted);font-weight:400;padding:0 6px}
.mrow .ctx{font-size:13px;color:var(--muted)}
.mrow .ctx a{text-decoration:underline;text-underline-offset:2px}
.mrow .res{text-align:right;font-size:14px}
@media (max-width:520px){.mrow{grid-template-columns:64px minmax(0,1fr)}.mrow .res{grid-column:2;text-align:left}}

/* season */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-deep);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.month h3{font-size:20px;text-transform:uppercase;letter-spacing:.05em;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.trow{display:grid;grid-template-columns:118px minmax(0,1.3fr) minmax(0,1fr);gap:4px 16px;padding:11px 2px;border-bottom:1px solid var(--line);text-decoration:none;align-items:start}
@media (hover:hover){.trow:hover .tname{color:var(--accent)}}
.trow .dates{font-family:var(--f-display);font-weight:600;font-size:17px;line-height:1.2}
.trow .tname{font-weight:600}
.trow .meta{font-size:13px;color:var(--muted)}
.trow .out{font-size:14px;min-width:0}
.trow .out .lbl{font-size:12px;color:var(--muted)}
.trow[data-st="live"]{background:linear-gradient(90deg,color-mix(in srgb,var(--live) 9%,transparent),transparent 60%)}
@media (max-width:640px){.trow{grid-template-columns:84px minmax(0,1fr)}.trow .out{grid-column:2}}

/* tournament page */
.back{font-size:14px;color:var(--muted);text-decoration:none}
@media (hover:hover){.back:hover{color:var(--accent)}}
.thead{display:flex;flex-direction:column;gap:10px}
.facts{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:14px}
.facts div{display:flex;flex-direction:column}
.facts .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.note{background:var(--surface);border-left:3px solid var(--accent);padding:10px 14px;border-radius:0 var(--r) var(--r) 0;font-size:14px;max-width:72ch}
.champ{background:var(--hi);color:var(--ink);border-left:4px solid var(--hi-ink);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:4px;max-width:520px}
.champ .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--hi-ink);font-weight:600}
.champ b{font-family:var(--f-display);font-size:28px;font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;padding:10px 14px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

.bracket-frame{overflow-x:auto;padding-bottom:8px;margin-inline:-4px}
.bracket{display:flex;gap:14px;padding:4px;min-height:120px}
.bcol{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1 0 224px;max-width:320px}
.colhead{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:2px 2px 6px;margin-bottom:2px;cursor:pointer;text-align:left}
.colhead b{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.colhead span{font-size:12px;color:var(--muted)}
@media (hover:hover){.colhead:hover span{color:var(--accent)}}
.colhead[data-now="1"] b{color:var(--accent)}
.bcol-c{flex:0 0 46px;display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 0;background:var(--sunk);border:1px dashed var(--line);border-radius:8px;cursor:pointer;color:var(--muted)}
@media (hover:hover){.bcol-c:hover{border-color:var(--accent);color:var(--accent)}}
.bcol-c .v{writing-mode:vertical-rl;transform:rotate(180deg);display:flex;gap:10px;align-items:center;white-space:nowrap}
.bcol-c b{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.bcol-c small{font-size:12px}
.bcol-c .plus{font-family:var(--f-display);font-weight:700;font-size:18px;line-height:1}
.btools{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.btools .chips{flex:1 1 auto}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--accent);font-size:14px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
@media (prefers-reduced-motion:no-preference){.bcol-c,.colhead span{transition:color .15s,border-color .15s}}
.bcol .stack{display:flex;flex-direction:column;justify-content:space-around;gap:8px;flex:1}
.mt{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:13.5px}
.mt.live{border-color:var(--live)}
.mt .p{display:flex;align-items:center;gap:6px;padding:5px 9px;min-height:28px}
.mt .p + .p{border-top:1px solid var(--line)}
.mt .p .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt .p.win .nm{font-weight:600}
.mt .p.win::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--done);flex:none}
.mt .p.lose .nm{color:var(--muted)}
.mt .p.empty .nm{color:var(--muted);font-style:italic}
.sd{font-size:11px;font-weight:600;color:var(--muted);min-width:14px}
.tag{font-size:10px;font-weight:600;letter-spacing:.04em;padding:0 4px;border-radius:3px;background:var(--sunk);color:var(--muted)}
.mt .foot{background:var(--sunk);padding:4px 9px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.mt .foot .sc{color:var(--ink);font-weight:500}
.mt .foot .lv{color:var(--live);font-weight:600}

.listr{display:flex;flex-direction:column;gap:20px}
.lr h3{font-size:18px;padding-bottom:6px;border-bottom:2px solid var(--ink);margin-bottom:4px}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 14px;padding:9px 2px;border-bottom:1px solid var(--line);align-items:baseline}
.lrow .run{font-family:var(--f-display);font-weight:600;font-size:18px}
.lrow .pt{font-size:12px;color:var(--muted)}
@media (max-width:520px){.lrow{grid-template-columns:minmax(0,1fr) auto}.lrow .pt{display:none}}

footer{color:var(--muted);font-size:12px}
@media (prefers-reduced-motion:no-preference){.tcard,.trow,.chip{transition:border-color .15s,background-color .15s,color .15s}}

/* Reference look, light edition: the bright broadcast header from the references (ATP electric blue + lime, WTA violet + teal, All = blue-to-violet), light tinted content below with dark text. */
:root{
  --bg:#f4f3fd; --sunk:#ecebfa; --ink:#16163f; --muted:#55577f; --line:#dcdbf2;
  --accent:#4a32d6; --accent-soft:#e7e3fc; --accent-deep:#3420a8;
  --hd:linear-gradient(100deg,#1f3fd0 0%,#3a2fc0 50%,#6a35e0 100%); --hd-ink:#ffffff; --hd-muted:#dcdcff; --hd-on:#ffffff; --hd-on-ink:#2c2a9c;
  --done:#0fa37f; --done-ink:#0a7d61; --done-soft:#d7f3ea;
  --atp:#2a30d0; --wta:#6a35e0}
:root[data-tt="atp"]{
  --bg:#edf2ff; --sunk:#e1e9ff; --ink:#0b1a4a; --muted:#46557f; --line:#cdd8f3;
  --accent:#1a3fc4; --accent-soft:#dde6ff; --accent-deep:#0f2470;
  --hd:linear-gradient(100deg,#1f3fd0 0%,#152c9c 50%,#0c1a5e 100%); --hd-muted:#c9d6ff; --hd-on:#9fc3ff; --hd-on-ink:#0c1a5e;
  --done:#2a6ae0; --done-ink:#1747a6; --done-soft:#dde6ff; --hi:#dde6ff; --hi-ink:#0f2470}
:root[data-tt="wta"]{
  --bg:#f5f1ff; --sunk:#ece5fd; --ink:#1d1238; --muted:#5c4f80; --line:#ddd3f3;
  --accent:#6a35e0; --accent-soft:#e9e0fd; --accent-deep:#4c20b0;
  --hd:linear-gradient(100deg,#6a35e0 0%,#4f24b8 45%,#2b5f8f 75%,#0f8a6c 100%); --hd-muted:#e2d6ff; --hd-on:#2fd3a3; --hd-on-ink:#0d2a24;
  --done:#0f9a76; --done-ink:#0a7a5d; --done-soft:#d5f2e8; --hi:#d5f2e8; --hi-ink:#0a5a46}
:root[data-tt="wta"] .chip[aria-pressed="true"]{background:#d5f2e8;color:#0a5a46;border-color:#9fdcc6}
:root[data-tt="wta"] .day h3{border-bottom-color:#0f9a76}
:root[data-tt="atp"] .day h3{border-bottom-color:#1a3fc4}
body::before{background:var(--hd)}
.board{background:var(--hd);color:var(--hd-ink);box-shadow:none}
.board::after{display:none}
.brand,.brand .t-atp,.brand .t-wta,:root[data-tt] .brand{color:var(--hd-ink)}
.brand small,.stamp{color:var(--hd-muted)}
.nav a{color:var(--hd-muted)}
.nav a[aria-current="page"]{background:#fff;color:var(--accent-deep)}
@media (hover:hover){.nav a:not([aria-current="page"]):hover{color:#fff}}
.tours{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35)}
.tours button{color:var(--hd-muted)}
.tours button[aria-pressed="true"],.tours button[data-tour="all"][aria-pressed="true"],.tours button[data-tour="atp"][aria-pressed="true"],.tours button[data-tour="wta"][aria-pressed="true"]{background:var(--hd-on);color:var(--hd-on-ink)}
.install{border-color:rgba(255,255,255,.45)!important;color:#fff!important}
h2{color:var(--ink)}
.card,.now-card{border-color:var(--line)}
</style>
</head>
<body>
<header class="board">
  <div class="wrap">
    <div class="brand"><span><span class="t-atp">ATP</span> &amp; <span class="t-wta">WTA</span> Board</span> <small>2026 season</small></div>
    <div class="tours" role="group" aria-label="Tour">
      <button type="button" data-tour="all">All</button>
      <button type="button" data-tour="atp">ATP</button>
      <button type="button" data-tour="wta">WTA</button>
    </div>
    <nav class="nav" aria-label="Sections">
      <a href="#now" data-nav="now">Now</a>
      <a href="#season" data-nav="season">Calendar</a>
      <a href="#rank" data-nav="rank">Rankings</a>
    </nav>
    <button class="install" id="install" type="button" hidden>Install app</button>
    <div class="stamp" id="stamp">Loading data…</div>
    <div class="ios-tip" id="ios-tip" hidden>On iPhone and iPad: tap Share at the bottom of Safari, then Add to Home Screen.</div>
  </div>
</header>

<main class="wrap" id="app">
  <div class="state">Loading the calendar, draws and schedule. ATP and WTA events and team cups will appear here, with match times in your time zone.</div>
</main>

<script>
(function(){
  const CAT = {
    gs:{label:"Grand Slam",pts:"2000 points"},
    m1000:{label:"ATP Masters 1000",pts:"1000 points"},
    a500:{label:"ATP 500",pts:"500 points"},
    a250:{label:"ATP 250",pts:"250 points"},
    finals:{label:"ATP Finals",pts:"up to 1500 points"},
    nextgen:{label:"Next Gen ATP",pts:"no ranking points"},
    davis:{label:"Davis Cup",pts:"team event"},
    laver:{label:"Laver Cup",pts:"team event"},
    team:{label:"United Cup",pts:"team event"},
    w1000:{label:"WTA 1000",pts:"1000 points"},
    w500:{label:"WTA 500",pts:"500 points"},
    w250:{label:"WTA 250",pts:"250 points"},
    wfinals:{label:"WTA Finals",pts:"up to 1500 points"},
    bjk:{label:"Billie Jean King Cup",pts:"team event"}
  };
  const GROUP = {gs:"gs",m1000:"1000",w1000:"1000",a500:"500",w500:"500",a250:"250",w250:"250",finals:"finals",wfinals:"finals",nextgen:"finals",davis:"team",laver:"team",team:"team",bjk:"team"};
  const FILTERS = [["all","All"],["gs","Grand Slams"],["1000","1000"],["500","500"],["250","250"],["finals","Finals"],["team","Team events"]];
  const SURF = {hard:["Hard","--hard"],"hard-i":["Indoor hard","--hard-i"],clay:["Clay","--clay"],grass:["Grass","--grass"],mixed:["Various","--mixed"]};
  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  const state = {seasons:{}, season:null, draws:{}, rankings:{}, err:null, filter:"all", tour:"all", tab:{}, collapse:{}, section:{}};
  const rkey = n => String(n||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").split(/[\s-]+/).filter(Boolean).sort().join(" ");
  let RANK = {};
  function buildRank(){ RANK = {}; for (const [tour,rk] of Object.entries(state.rankings)) (rk.list||[]).forEach(x=>{ RANK[rkey(x.n)] = {r:x.r, p:x.p, tour}; }); }
  const rankOf = p => (p && p.n && !p.team) ? RANK[rkey(p.n)] : null;
  // ---------- my players (stored on this device) ----------
  let FAV = {};
  try{ FAV = JSON.parse(localStorage.getItem("tablo-favs")||"{}") || {}; }catch(e){ FAV = {}; }
  state.mineOpen = false; try{ state.mineOpen = localStorage.getItem("tablo-mine-open")==="1"; }catch(e){}
  const isFav = n => !!FAV[rkey(n)];
  const favable = p => p && p.n && !p.team && !p.bye && !p.tbd && p.n!=="Qualifier";
  const starBtn = n => { const on = isFav(n); const lbl = (on?"Remove from":"Add to")+" my players";
    return `<button class="star" type="button" data-fav="${esc(n)}" data-k="${esc(rkey(n))}" aria-pressed="${on}" aria-label="${lbl}" title="${lbl}">${on?"★":"☆"}</button>`; };
  try{ state.filter = localStorage.getItem("tablo-filter2") || "all"; state.tour = localStorage.getItem("tablo-tour") || "all"; }catch(e){}
  function rebuild(){
    const list = [];
    for (const [tour,s] of Object.entries(state.seasons)) (s.tournaments||[]).forEach(t=>list.push(Object.assign({tour}, t)));
    list.sort((a,b)=>a.start.localeCompare(b.start)||a.end.localeCompare(b.end)||a.tour.localeCompare(b.tour));
    const ups = Object.values(state.seasons).map(s=>s.updatedAt).filter(Boolean).sort();
    state.season = list.length ? {tournaments:list, updatedAt:ups[ups.length-1]} : null;
  }
  // United Cup is one mixed event listed in both calendars: show it once in the combined view
  const inTour = t => state.tour==="all" ? !(t.cat==="team" && t.tour==="wta") : t.tour===state.tour;
  function paintTours(){ document.querySelectorAll("[data-tour]").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.tour===state.tour))); }
  document.querySelector(".tours").addEventListener("click", e=>{
    const b = e.target.closest("[data-tour]"); if(!b) return;
    state.tour = b.dataset.tour; try{localStorage.setItem("tablo-tour",state.tour)}catch(err){}
    paintTours(); route();
  });
  paintTours();

  const app = document.getElementById("app");
  const stamp = document.getElementById("stamp");
  const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  // ---------- dates ----------
  const pad = n => String(n).padStart(2,"0");
  const localISO = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  const todayISO = () => localISO(new Date());
  const parseDay = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
  const LOC = "en-GB";
  const fmtDay = s => parseDay(s).toLocaleDateString(LOC,{day:"numeric",month:"long"});
  const fmtDayLong = s => parseDay(s).toLocaleDateString(LOC,{weekday:"long",day:"numeric",month:"long"});
  const fmtShort = s => parseDay(s).toLocaleDateString(LOC,{day:"numeric",month:"short"});
  const fmtRange = (a,b) => {
    const A=parseDay(a), B=parseDay(b);
    const mon = d => d.toLocaleDateString(LOC,{month:"short"});
    if (A.getMonth()===B.getMonth()) return A.getDate()+"–"+B.getDate()+" "+mon(B);
    return A.getDate()+" "+mon(A)+"–"+B.getDate()+" "+mon(B);
  };
  const fmtTime = iso => new Date(iso).toLocaleTimeString(LOC,{hour:"2-digit",minute:"2-digit"});
  let TZ = "";
  try{
    const parts = new Intl.DateTimeFormat(LOC,{timeZoneName:"short"}).formatToParts(new Date());
    TZ = (parts.find(p=>p.type==="timeZoneName")||{}).value || "";
  }catch(e){}
  const dayOfMatch = m => m.t ? localISO(new Date(m.t)) : (m.d || null);

  const tStatus = t => { const d=todayISO(); return t.end < d ? "done" : (t.start <= d ? "live" : "next"); };
  const byId = id => (state.season && state.season.tournaments || []).find(t=>t.id===id);

  // ---------- small renderers ----------
  const tourMark = t => `<span class="tour" data-t="${esc(t.tour)}">${t.tour==="wta"?"WTA":"ATP"}</span>`;
  const catLabel = t => t.cat==="gs" ? `${t.tour==="wta"?"WTA":"ATP"} Grand Slam` : ((CAT[t.cat]||{}).label||t.cat);
  const catMark = t => `<span class="cat" data-c="${esc(t.cat)}">${esc(catLabel(t))}</span>`;
  const surfMark = t => { const s=SURF[t.surf]||SURF.mixed; return `<span class="surf" style="--c:var(${s[1]})">${s[0]}</span>`; };
  const statusPill = t => { const s=tStatus(t); return s==="live"?`<span class="pill live">Live</span>`:s==="done"?`<span class="pill done">Finished</span>`:`<span class="pill">Upcoming</span>`; };

  function pName(p){
    if(!p) return `<span class="nm">—</span>`;
    if(p.bye) return `<span class="nm">bye</span>`;
    if(p.tbd) return `<span class="nm">TBD</span>`;
    const rk = rankOf(p);
    return (p.s?`<span class="sd">${esc(p.s)}</span>`:"")+`<span class="nm" title="${esc(p.n)}">${esc(p.n)}</span>`+(p.tag?`<span class="tag">${esc(p.tag)}</span>`:"")+(rk?`<span class="rk" title="Ranking">#${rk.r}</span>`:"");
  }
  const plain = p => !p ? "—" : p.bye ? "bye" : p.tbd ? "TBD" : p.n + (p.s?` [${p.s}]`:"") + (p.tag?` (${p.tag})`:"");

  function matchFoot(m){
    if (m.st==="live") return `<span class="lv">Live</span><span>${m.t?fmtTime(m.t):""}</span>`;
    if (m.w && m.sc) return `<span class="sc">${esc(m.sc)}</span><span>${m.d?fmtShort(m.d):""}</span>`;
    if (m.t) return `<span>${fmtShort(dayOfMatch(m))}, ${m.nb?"not before ":""}${fmtTime(m.t)}</span><span></span>`;
    if (m.d) return `<span>${fmtShort(m.d)}, time TBC</span><span></span>`;
    return "";
  }
  function matchCard(m){
    const side = (p,i) => {
      const empty = !p || p.bye || p.tbd || (p.tag==="Q" && p.n==="Qualifier");
      const cls = m.w ? (m.w===i?"win":"lose") : (empty?"empty":"");
      const fk = favable(p) ? rkey(p.n) : "";
      return `<div class="p ${cls}${fk && FAV[fk]?" fav":""}"${fk?` data-pk="${esc(fk)}"`:""}>${pName(p)}</div>`;
    };
    const foot = matchFoot(m);
    return `<div class="mt ${m.st==="live"?"live":""}">${side(m.a,1)}${side(m.b,2)}${foot?`<div class="foot">${foot}</div>`:""}</div>`;
  }

  // ---------- views ----------
  function viewNow(){
    const ts = state.season.tournaments;
    const today = todayISO();
    const live = ts.filter(t=>tStatus(t)==="live" && inTour(t));
    const next = ts.filter(t=>tStatus(t)==="next" && inTour(t)).slice(0,6);

    // collect dated matches from today on
    const limit = localISO(new Date(Date.now()+12*864e5));
    const items = [];
    for (const [id,dr] of Object.entries(state.draws)){
      const t = byId(id); if(!t || !inTour(t)) continue;
      const groups = (dr.rounds||[]).concat(dr.extra||[]);
      for (const r of groups) for (const m of (r.matches||[])){
        const day = dayOfMatch(m); if(!day || day<today || day>limit) continue;
        items.push({t, r, m, day});
      }
    }
    items.sort((x,y)=> x.day.localeCompare(y.day) || (x.m.t||"9").localeCompare(y.m.t||"9"));
    const byDay = {};
    items.forEach(it=>{ (byDay[it.day]=byDay[it.day]||[]).push(it); });

    const liveCards = live.length ? live.map(t=>`
      <a class="tcard" href="#t-${esc(t.id)}">
        <div class="row">${catMark(t)}${statusPill(t)}</div>
        <h3>${esc(t.name)}</h3>
        <div class="row hint"><span>${esc(t.city)}</span><span>${fmtRange(t.start,t.end)}</span></div>
        <div class="row">${surfMark(t)}</div>
      </a>`).join("") : `<div class="state">No tournaments are on right now. The next ones are below.</div>`;

    const days = Object.keys(byDay).length ? Object.keys(byDay).map(day=>`
      <div class="day">
        <h3><b>${day===today?"Today":esc(fmtDayLong(day))}</b>${day===today?", "+esc(fmtDay(day)):""}</h3>
        ${byDay[day].map(({t,r,m})=>schedRow(t,r,m,true)).join("")}
      </div>`).join("") : `<div class="state">No scheduled matches for the next few days yet.</div>`;

    const nextRows = next.map(seasonRow).join("");

    return viewMine() + `
      <section class="sec">
        <div class="sec-head"><h2>On now</h2></div>
        <div class="live-grid">${liveCards}</div>
      </section>
      <section class="sec">
        <div class="sec-head"><h2>Order of play</h2><span class="hint">Times are in your local time${TZ?" ("+esc(TZ)+")":""}. “Not before” means the match follows the previous one on that court.</span></div>
        <div class="days">${days}</div>
      </section>
      <section class="sec">
        <div class="sec-head"><h2>Coming up</h2><a class="hint" href="#season">Full calendar →</a></div>
        <div>${nextRows}</div>
      </section>`;
  }

  function schedRow(t,r,m,withT){
    const time = m.t ? `${fmtTime(m.t)}${m.nb?"<small>not before</small>":""}` : `—<small>TBC</small>`;
    const a = m.a, b = m.b;
    const rkTag = p => { const rk = rankOf(p); return rk ? `<small class="rk" title="Ranking">#${rk.r}</small>` : ""; };
    const who = (p,i) => { const fk = favable(p) ? rkey(p.n) : "";
      return `<span class="${m.w===i?"w":""}${fk && FAV[fk]?" fav":""}"${fk?` data-pk="${esc(fk)}"`:""}>${esc(plain(p))}${rkTag(p)}</span>`; };
    const players = `${who(a,1)}<span class="vs">—</span>${who(b,2)}`;
    const res = m.st==="live" ? `<span class="pill live">Live</span>` : (m.w && m.sc ? esc(m.sc) : "");
    const ctx = (withT?`<a href="#t-${esc(t.id)}">${esc(t.name)}</a>, `:"") + esc(r.name) + (m.court?`, ${esc(m.court)}`:"");
    return `<div class="mrow"><div class="time">${time}</div><div class="who"><div class="players">${players}</div><div class="ctx">${ctx}</div></div><div class="res">${res}</div></div>`;
  }

  function seasonRow(t){
    const st = tStatus(t);
    let out;
    if (t.champ) out = `<div class="lbl">Champion</div><div><b>${esc(t.champ)}</b></div>${t.runner?`<div class="meta">d. ${esc(t.runner)} ${esc(t.score)}</div>`:""}`;
    else if (t.note && st==="done") out = `<div class="lbl">Result</div><div>${esc(t.note)}</div>`;
    else out = `<div>${statusPill(t)}</div>${t.draw?`<div class="meta">Draw and schedule available</div>`:""}`;
    return `<a class="trow" data-st="${st}" href="#t-${esc(t.id)}">
      <div class="dates">${fmtRange(t.start,t.end)}</div>
      <div><div class="tname">${esc(t.name)}</div><div class="meta">${esc(t.city)}, ${esc(t.country)}</div><div class="row" style="margin-top:4px">${catMark(t)}${surfMark(t)}</div></div>
      <div class="out">${out}</div></a>`;
  }

  function viewSeason(){
    const f = state.filter;
    const ts = state.season.tournaments.filter(t=> inTour(t) && (f==="all" || GROUP[t.cat]===f));
    const months = {};
    ts.forEach(t=>{ const k=t.start.slice(0,7); (months[k]=months[k]||[]).push(t); });
    const body = Object.keys(months).sort().map(k=>{
      const m = Number(k.slice(5))-1;
      return `<section class="month sec"><h3>${MONTHS[m]} ${k.slice(0,4)}</h3><div>${months[k].map(seasonRow).join("")}</div></section>`;
    }).join("") || `<div class="state">No tournaments in this category.</div>`;
    return `
      <section class="sec">
        <div class="sec-head"><h1>Season calendar</h1><span class="hint">${ts.length} events</span></div>
        <div class="chips" role="group" aria-label="Category">${FILTERS.map(([k,l])=>`<button class="chip" type="button" data-filter="${k}" aria-pressed="${k===f}">${l}</button>`).join("")}</div>
      </section>${body}`;
  }

  function viewTournament(id){
    const t = byId(id);
    if (!t) return `<a class="back" href="#season">← Calendar</a><div class="state">This tournament is not in the calendar.</div>`;
    const dr = state.draws[id];
    const st = tStatus(t);
    let head = `
      <a class="back" href="#season">← Calendar</a>
      <div class="thead">
        <div class="row">${catMark(t)}${statusPill(t)}</div>
        <h1>${esc(t.name)}</h1>
        <div class="facts">
          <div><span class="lbl">Dates</span>${esc(fmtDay(t.start))} – ${esc(fmtDay(t.end))}</div>
          <div><span class="lbl">Venue</span>${esc(t.city)}, ${esc(t.country)}</div>
          <div><span class="lbl">Surface</span>${surfMark(t)}</div>

  // ---------- rankings ----------
  function playingNow(){

        }</tbody></table>${state.onlyFav && !rk.list.some(x=>isFav(x.n)) ? `<div class="state">None of your players are in the ${tour.toUpperCase()} top 100 yet. Tap ☆ next to a name to add one.</div>` : ""}</section>`;

        <div class="legend"><span class="hint">Tournament colours:</span><span data-g="gs">Grand Slam</span><span data-g="1000">1000</span><span data-g="500">500</span><span data-g="250">250</span><span data-g="finals">Finals</span></div>

  const ROUND_LABEL = {"R128":"R128","R64":"R64","R32":"R32","R16":"R16","QF":"QF","SF":"SF","Final":"Final"};
  // How far a player went in one tournament: from its draw when the app has one, otherwise from the calendar
  function resultIn(t, k){
    const dr = state.draws[t.id];
    if (dr && dr.type==="knockout"){
      let last = null;
      dr.rounds.forEach((r,ri)=>(r.matches||[]).forEach(m=>{
        const side = m.a && m.a.n && rkey(m.a.n)===k ? 1 : (m.b && m.b.n && rkey(m.b.n)===k ? 2 : 0);
        if (!side) return;
        const opp = side===1 ? m.b : m.a;
        if (opp && opp.bye) return;
        last = {ri, r, m, side};
      }));
      if (last){
        const final = last.ri===dr.rounds.length-1;
        if (last.m.w===last.side && final) return {code:"W", label:"Title", rank:7};

  function playerCard(name, tour){

      : `<p class="hint">No tour-level quarterfinals or better in 2026 yet.</p>`;
    return `<div class="pd">
      <div class="pd-sum"><span><b>${titles}</b> ${titles===1?"title":"titles"}</span><span><b>${finals}</b> ${finals===1?"lost final":"lost finals"}</span><span><b>${semis}</b> ${semis===1?"semifinal":"semifinals"}</span></div>

  // Next or current match for a followed player, across tournaments that are on or coming up
  function nextFor(k){
    let best = null;
    for (const [id,dr] of Object.entries(state.draws)){
      const t = byId(id); if (!t || tStatus(t)==="done" || dr.type!=="knockout") continue;
      for (const r of (dr.rounds||[]).concat(dr.extra||[])) for (const m of (r.matches||[])){

        const side = m.a && m.a.n && rkey(m.a.n)===k ? 1 : (m.b && m.b.n && rkey(m.b.n)===k ? 2 : 0);
        if (!side) continue;
        const opp = side===1 ? m.b : m.a; if (opp && opp.bye) continue;
        const when = m.t || (m.d ? m.d+"T23:59:00Z" : t.start+"T23:59:00Z");

  // ---------- bracket: collapsing & sections ----------
  const isPlayed = m => !!m.w || !!(m.a && m.a.bye) || !!(m.b && m.b.bye);
  const roundDone = r => (r.matches||[]).length>0 && r.matches.every(isPlayed);
  function autoCollapsed(dr){
    const n = dr.rounds.length; let last = -1;
    for (let i=0;i<n;i++){ if (roundDone(dr.rounds[i])) last = i; else break; }
    const keep = Math.min(last, n-2);       // the latest finished round stays open for context
    const set = {}; for (let i=0;i<keep;i++) set[i] = true;
    return {set, current: Math.min(last+1, n-1)};
  }

    if (!sec) return matches;
    const m = matches.length, i = sec-1;

        name.map((nm,k)=>{ const lb=sectionLabel(first,k+1,parts); return `<button class="chip" type="button" data-sec="${k+1}" aria-pressed="${sec===k+1}" title="${esc(nm)}">${parts===4?"Q"+(k+1):(k?"Bottom":"Top")}${lb?`<span class="chip-sub">${esc(lb)}</span>`:""}</button>`; }).join("")}</div>`;
    }

      }

  // ---------- routing ----------

    if (brk){
      const dr = state.draws[id]; if(!dr) return;
      if (brk.dataset.brk==="open"){ const c={}; dr.rounds.forEach((r,i)=>c[i]=false); state.collapse[id]=c; }
      else delete state.collapse[id];
      keepScroll(); return;
    }
    const sc = e.target.closest("[data-sec]");
    if (sc){ state.section[id] = Number(sc.dataset.sec); keepScroll(); }
  });

  function setStamp(meta){
    if (!state.season) return;
    const u = state.season.updatedAt ? new Date(state.season.updatedAt) : null;
    const parts = [u ? "Updated " + u.toLocaleString(LOC,{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"}) : "Data loaded"];
    if (meta && meta.stale) parts.push("Connection not confirmed yet");
    if (TZ) parts.push("Times in " + TZ);
    stamp.innerHTML = parts.map(x=>`<span>${esc(x)}</span>`).join("");
  }

  // ---------- data ----------
  route();
  let lastLoad = 0;
  async function load(){
    lastLoad = Date.now();
    try{
      const r = await fetch("data/tablo.json?ts=" + Date.now(), {cache:"no-store"});
      if (!r.ok) throw new Error(r.status);
      const j = await r.json();
      state.seasons = j.seasons || {}; state.draws = j.draws || {}; state.rankings = j.rankings || {}; buildRank();
      state.err = null; rebuild(); setStamp();
      const y = window.scrollY; route(); window.scrollTo(0, y);
    }catch(e){
      if (!state.season){ state.err = "Could not load the data. Check your connection and open the app again."; route(); stamp.textContent = "Offline"; }
      else stamp.insertAdjacentHTML("beforeend", "<span>Offline, showing saved data</span>");
    }
  }
  load();
  document.addEventListener("visibilitychange", ()=>{ if (document.visibilityState==="visible" && Date.now()-lastLoad > 5*60*1000) load(); });
  setInterval(()=>{ if (document.visibilityState==="visible") load(); }, 15*60*1000);

  // ---------- install ----------
  const installBtn = document.getElementById("install");
  const iosTip = document.getElementById("ios-tip");
  let deferred = null;
  const standalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone;
  window.addEventListener("beforeinstallprompt", e=>{ e.preventDefault(); deferred = e; if(!standalone) installBtn.hidden = false; });
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
  if (isIOS && !standalone) installBtn.hidden = false;
  installBtn.addEventListener("click", async ()=>{
    if (deferred){ deferred.prompt(); await deferred.userChoice.catch(()=>{}); deferred = null; installBtn.hidden = true; }
    else iosTip.hidden = !iosTip.hidden;
  });
  window.addEventListener("appinstalled", ()=>{ installBtn.hidden = true; });
  if ("serviceWorker" in navigator) window.addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
})();
</script>
</body>
</html>
